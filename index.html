<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>索書快速記錄</title>
<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3/dist/iife/polyfill.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans TC",sans-serif}
body{background:#f4f6f9;margin:0;padding:10px;color:#222}
.wrap{max-width:760px;margin:0 auto;background:#fff;border-radius:12px;padding:14px}
h1{font-size:1.15rem;text-align:center;margin:0 0 12px}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
button{flex:1;padding:11px 10px;border:0;border-radius:8px;font-weight:600;font-size:.9rem;color:#fff;background:#3b82f6}
button.g{background:#6b7280}button.ok{background:#10b981}button.red{background:#ef4444}
input{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:6px;font-size:1rem}
#reader{width:100%;display:none;margin-bottom:10px;border-radius:8px;overflow:hidden}
.add{display:flex;gap:8px;margin-bottom:10px}.add button{flex:0 0 80px}
.stat{font-size:.85rem;color:#555;margin:6px 0}
.card{border:1px solid #e5e7eb;border-radius:8px;padding:9px;margin-bottom:8px}
.card.miss{border-color:#ef4444;background:#fef2f2}.card.pending{border-color:#f59e0b;background:#fffbeb}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:#666;margin-bottom:6px}
.badge{font-weight:700}.b-ok{color:#059669}.b-miss{color:#dc2626}.b-pending{color:#d97706}
.card input{margin-bottom:5px}
.del{flex:0 0 auto;padding:3px 9px;font-size:.75rem;background:#ef4444}
.shelf{display:flex;gap:8px;margin-bottom:10px}.shelf select{flex:1;padding:10px;font-size:1rem;border:1px solid #d1d5db;border-radius:6px}.shelf button{flex:0 0 70px}.shelf label{flex:0 0 66px;align-self:center;font-size:.85rem;font-weight:600}
body{padding-bottom:110px}.lb{font-size:.75rem;color:#6b7280;margin:3px 0 2px}input.warn{background:#fff7ed;border-color:#f59e0b}.card.new{border-color:#10b981;box-shadow:0 0 0 2px #a7f3d0}
#last{position:fixed;left:0;right:0;bottom:0;background:#065f46;color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));font-size:.9rem;line-height:1.4;z-index:8;display:none}#last.w{background:#b45309}#last.r{background:#b91c1c}
#ov{position:fixed;inset:0;background:#fff;overflow:auto;z-index:20;padding:12px 12px 40px;display:none}
#ov h3{margin:14px 0 4px;font-size:1.05rem;background:#eef2ff;padding:6px 8px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#ov h4{margin:8px 0 2px;font-size:.92rem;color:#374151}#ov table{width:100%;border-collapse:collapse;font-size:.85rem}
#ov td{padding:5px 4px;border-bottom:1px solid #e5e7eb;vertical-align:top}#ov .m{color:#b45309;font-size:.75rem}
#ov .cp{flex:0 0 auto;padding:4px 10px;font-size:.78rem}.tabs{display:flex;gap:8px;margin:8px 0}.tabs button{padding:8px}
.s{color:#6b7280;font-size:.8rem}.b-part{color:#d97706}.card.part{border-color:#f59e0b;background:#fffbeb}
.ovl{position:fixed;inset:0;background:#fff;overflow:auto;z-index:25;padding:12px 12px 40px;display:none}
.fm label{display:block;font-size:.8rem;color:#6b7280;margin:8px 0 2px}.fm input,.fm select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:6px;font-size:1rem}
.pk{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #e5e7eb;font-size:.9rem}.pk input{width:auto;margin-top:4px}
.err{color:#dc2626;font-size:.8rem;margin-top:4px}
#ov .r{padding:7px 0;border-bottom:1px solid #e5e7eb;font-size:.85rem;line-height:1.5}#ov .tg{font-size:.72rem;background:#eef2ff;color:#3730a3;padding:1px 6px;border-radius:6px}
#td .r{padding:8px 0;border-bottom:1px solid #e5e7eb;font-size:.88rem;line-height:1.5}#td .tg{font-size:.72rem;padding:1px 6px;border-radius:6px}#td .cp{flex:0 0 auto;padding:6px 14px;font-size:.8rem}
#nm .cp{flex:0 0 auto;padding:6px 12px;font-size:.8rem}
#isbnErr{display:none}#isbnErr.on{display:block;margin:-4px 0 10px;padding:8px 10px;background:#fef2f2;border:1px solid #fca5a5;color:#b91c1c;border-radius:6px;font-size:.88rem;line-height:1.45}
#ag .cp{flex:0 0 auto;padding:6px 12px;font-size:.8rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:20px;font-size:.9rem;display:none;z-index:30}
@media print{.np{display:none!important}body{background:#fff;padding:0}.wrap{padding:0}.card input{border:0;padding:2px}}
</style>
</head>
<body>
<div class="wrap">
<h1>📖 索書快速記錄</h1>
<div class="np">
  <div class="shelf"><label>被授權者</label><select id="eeSel" onchange="setCtx('ee',this.value)"></select><button class="g" onclick="newCtx('ee')">＋新增</button></div>
  <div class="shelf"><label>授權者</label><select id="orSel" onchange="setCtx('or',this.value)"></select><button class="g" onclick="newCtx('or')">＋新增</button></div>
  <div class="shelf"><label>版代</label><select id="agSel" onchange="setAgent(this.value)"></select><button class="g" onclick="newAgent()">＋新增</button></div>
  <button class="g" style="width:100%;padding:8px;font-size:.85rem;margin:-4px 0 10px" onclick="openNm()">✎ 修改或刪除名稱（被授權者／授權者／版代）</button>
  <button class="g" style="width:100%;padding:8px;font-size:.85rem;margin:-4px 0 10px" onclick="openMvAll()">↪ 把目前這一組的書全部移到別組</button>
  <button class="g" style="width:100%;padding:8px;font-size:.85rem;margin:-4px 0 10px" onclick="if (ctx.or === U) toast('請先選擇授權者'); else document.getElementById('impList').click()">📄 匯入授權者提供的書單（Excel／CSV）</button>
  <input type="file" id="impList" accept=".xlsx,.xls,.csv" style="display:none" onchange="readList(event)">
  <button id="camBtn" class="ok" style="width:100%;margin-bottom:10px" onclick="toggleCam()">📷 開始連續掃描</button>
  <div id="reader"></div>
  <video id="vid" playsinline muted autoplay style="display:none;width:100%;border-radius:8px;margin-bottom:10px;background:#000"></video>
  <div id="scanInfo" class="stat"></div>
  <div class="add">
    <input id="isbnIn" oninput="clrErr()" type="text" inputmode="numeric" placeholder="手動輸入 ISBN，或貼上 Amazon 網址">
    <button class="g" style="flex:0 0 52px" onclick="clearIsbn()" aria-label="清除輸入">✕</button>
    <button onclick="manualAdd()">加入</button>
  </div>
  <div id="isbnErr"></div>
  <div class="row">
    <button class="g" onclick="openFm()">✏️ 手寫新增</button>
    <button class="g" onclick="openPk()">📥 從授權者已有的書挑選</button>
  </div>
  <div class="row">
    <button class="g" id="todoBtn" onclick="openTodo()">⚠ 待處理 (0)</button>
    <button onclick="openOv()">📋 總覽（發信前確認）</button>
  </div>
  <details style="margin-bottom:10px"><summary style="padding:8px 2px;font-weight:600;color:#555">更多功能（匯出 CSV、備份、清空）</summary>
  <div class="row" style="margin-top:8px">
    <button class="g" onclick="openAg()">📤 給版代 CSV／文字</button>
    <button class="g" onclick="exportOr()">📤 給授權者 CSV</button>
    <button class="g" onclick="exportEe()">📤 給被授權者 CSV</button>
    <button class="g" onclick="exportAll()">全部 CSV</button>
    <button class="g" onclick="window.print()">列印/PDF</button>
  </div>
  <div class="row">
    <button class="g" onclick="exportJSON()">備份 JSON</button>
    <button class="g" onclick="document.getElementById('imp').click()">匯入（合併）</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>
  <div class="row">
    <button class="red" onclick="clearBooks()">🗑 清空書單（保留公司名單與版代設定）</button>
  </div>
  </details>
</div>
<div class="np" style="margin:8px 0"><input id="q" placeholder="🔍 搜尋書名、著者、出版社、ISBN" oninput="render()"><label style="display:flex;gap:6px;align-items:center;font-size:.8rem;color:#555;margin-top:4px"><input type="checkbox" id="qall" style="width:auto" onchange="render()"> 搜尋所有組合（不只目前這一組）</label></div>
<div class="stat" id="stat"></div>
<div id="list"></div>
</div>
<div id="ov"></div>
<div id="fm" class="ovl"></div>
<div id="pk" class="ovl"></div>
<div id="td" class="ovl"></div>
<div id="nm" class="ovl"></div>
<div id="mv" class="ovl"></div>
<div id="im" class="ovl"></div>
<div id="ag" class="ovl"></div>
<div id="toast"></div>
<div id="last"></div>

<script>
const KEY = 'copyright_books_v2';
const DC = 'http://purl.org/dc/elements/1.1/';
let books = load(), scanner = null, scanning = false, last = { c: '', t: 0 };

function load() {
  try {
    const v2 = localStorage.getItem(KEY);
    if (v2) return JSON.parse(v2);
    const old = JSON.parse(localStorage.getItem('copyright_books') || '[]');
    return old.map(o => ({
      id: o.id, isbn: (o.isbn || '').replace(/\D/g, ''), title: o.title || '',
      publisher: o.publisher === '未提供' ? '' : (o.publisher || ''),
      author: o.author === '未提供' ? '' : (o.author || ''),
      note: o.note || '', st: o.title ? 'ok' : 'miss', ts: o.id
    }));
  } catch (e) { return []; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(books)); } catch (e) {} }
const U = '未指定';
let lastId = null;
let ctx = (() => { try { return JSON.parse(localStorage.getItem('ctx_v1')) || {}; } catch (e) { return {}; } })();
let lists = (() => { try { return JSON.parse(localStorage.getItem('lists_v1')) || { ee: [], or: [] }; } catch (e) { return { ee: [], or: [] }; } })();
ctx.ee = ctx.ee || U; ctx.or = ctx.or || U;
lists.ag = lists.ag || [];
let agents = (() => { try { return JSON.parse(localStorage.getItem('agents_v1')) || {}; } catch (e) { return {}; } })();
const pkey = (e, o) => e + '||' + o;
const agentOf = (e, o) => agents[pkey(e, o)] || '';
const eeOf = b => b.lee || b.shelf || U, orOf = b => b.lor || U;
const inCtx = b => eeOf(b) === ctx.ee && orOf(b) === ctx.or && !b.cand;
function opts(k) { return [...new Set([U, ...(lists[k] || []), ...books.map(k === 'ee' ? eeOf : orOf)])]; }
function saveCtx() { try { localStorage.setItem('ctx_v1', JSON.stringify(ctx)); localStorage.setItem('lists_v1', JSON.stringify(lists)); localStorage.setItem('agents_v1', JSON.stringify(agents)); } catch (e) {} }
function setAgent(v) {
  if (ctx.ee === U || ctx.or === U) { toast('請先選擇被授權者與授權者'); render(); return; }
  if (v) agents[pkey(ctx.ee, ctx.or)] = v; else delete agents[pkey(ctx.ee, ctx.or)];
  saveCtx(); render();
}
function newAgent() {
  if (ctx.ee === U || ctx.or === U) return toast('請先選擇被授權者與授權者');
  const n = (prompt('新增日方版代（公司名）') || '').trim();
  if (!n) return;
  if (!lists.ag.includes(n)) lists.ag.push(n);
  setAgent(n);
}
function setCtx(k, v) { ctx[k] = v; saveCtx(); render(); }
function newCtx(k) {
  const n = (prompt(k === 'ee' ? '新增被授權者（公司名）' : '新增授權者（公司名）') || '').trim();
  if (!n) return;
  if (!lists[k].includes(n)) lists[k].push(n);
  ctx[k] = n; saveCtx(); render();
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(m) {
  const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3000);
}

/* ISBN 驗證：只接受 978/979 開頭的 13 碼（日本書的第二組 192 價格條碼會被忽略） */
function check13(s) {
  if (!/^97[89]\d{10}$/.test(s)) return false;
  let sum = 0;
  for (let i = 0; i < 12; i++) sum += (+s[i]) * (i % 2 ? 3 : 1);
  return (10 - sum % 10) % 10 === +s[12];
}
function normIsbn(raw) {
  const s = String(raw).replace(/[^0-9Xx]/g, '').toUpperCase();
  if (s.length === 10) {
    const b = '978' + s.slice(0, 9); let sum = 0;
    for (let i = 0; i < 12; i++) sum += (+b[i]) * (i % 2 ? 3 : 1);
    return b + ((10 - sum % 10) % 10);
  }
  return s;
}

/* 書目來源：日文書優先 NDL，其次 Google Books、Open Library */
const SOURCES = [
  { name: 'NDL', async get(isbn, sig) {
    const r = await fetch('https://ndlsearch.ndl.go.jp/api/opensearch?isbn=' + isbn, { signal: sig });
    if (!r.ok) throw new Error('http');
    const x = new DOMParser().parseFromString(await r.text(), 'text/xml');
    const it = x.getElementsByTagName('item')[0];
    if (!it) return null;
    const g = (ns, n) => { const e = it.getElementsByTagNameNS(ns, n)[0]; return e ? e.textContent.trim() : ''; };
    const title = g(DC, 'title') || (it.getElementsByTagName('title')[0] || {}).textContent || '';
    const au = it.getElementsByTagName('author')[0];
    return { title: title.trim(), publisher: g(DC, 'publisher'), author: au ? au.textContent.trim() : g(DC, 'creator'), date: g(DC, 'date') };
  } },
  { name: 'Google', async get(isbn, sig) {
    const r = await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:' + isbn, { signal: sig });
    if (!r.ok) throw new Error('http');
    const d = await r.json();
    if (!d.items || !d.items.length) return null;
    const v = d.items[0].volumeInfo;
    return { title: v.title || '', publisher: v.publisher || '', author: (v.authors || []).join('、'), date: v.publishedDate || '' };
  } },
  { name: 'OpenLibrary', async get(isbn, sig) {
    const r = await fetch('https://openlibrary.org/api/books?bibkeys=ISBN:' + isbn + '&format=json&jscmd=data', { signal: sig });
    if (!r.ok) throw new Error('http');
    const d = (await r.json())['ISBN:' + isbn];
    if (!d) return null;
    return { title: d.title || '', publisher: ((d.publishers || [])[0] || {}).name || '', author: (d.authors || []).map(a => a.name).join('、'), date: d.publish_date || '' };
  } }
];

const JP = { '591': 'ポプラ社', '569': 'PHP研究所', '334': '光文社', '575': '双葉社', '480': '筑摩書房', '478': 'ダイヤモンド社', '04': 'KADOKAWA', '06': '講談社', '08': '集英社', '09': '小学館', '10': '新潮社', '12': '中央公論新社', '16': '文藝春秋' };
function fixCreators(b) {
  if (!b.author || b.illus) return;
  const parts = b.author.split(/[,，;；]/).map(x => x.trim()).filter(Boolean);
  const au = [], il = [];
  parts.forEach(x => {
    let m;
    if ((m = x.match(/^(.+?)\s*(挿絵|イラスト|絵|画)$/))) il.push(m[1].trim());
    else if ((m = x.match(/^(.+?)\s*(原作|原著|作|著|文)$/))) au.push(m[1].trim());
  });
  const heads = parts.filter(x => !/^\d{3,4}-\d{0,4}$/.test(x)).join(' ');
  if (au.length || il.length) { b.author = au.length ? au.join('、') : heads; b.illus = il.join('、'); }
  else if (/\d{4}-/.test(b.author)) b.author = heads;
}
function jpGuess(isbn) {
  if (!isbn.startsWith('9784')) return '';
  const r = isbn.slice(4);
  return JP[r.slice(0, 3)] || JP[r.slice(0, 2)] || '';
}
const isRoman = s => !!s && !/[\u3040-\u30FF\u3400-\u9FFF]/.test(s) && !Object.values(JP).some(v => v.toLowerCase() === s.replace(/\s/g, '').toLowerCase());

async function lookup(b) {
  const res = await Promise.all(SOURCES.map(async s => {
    const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 5000);
    try { return { n: s.name, r: await s.get(b.isbn, ac.signal) }; }
    catch (e) { return { n: s.name, e: 1 }; }
    finally { clearTimeout(tm); }
  }));
  const log = [];
  res.forEach(x => {
    const has = x.r && (x.r.title || x.r.author || x.r.publisher);
    log.push(x.n + (x.e ? '連線失敗' : has ? '✓' : '無資料'));
    if (has) { ['title', 'publisher', 'author', 'date'].forEach(f => { if (!b[f] && x.r[f]) b[f] = x.r[f]; }); if (!b.src) b.src = x.n; }
  });
  fixCreators(b);
  const found = !!(b.title || b.author || b.publisher);
  const g = jpGuess(b.isbn);
  if (g && (!b.publisher || isRoman(b.publisher))) { b.publisher = g; b.guess = true; log.push('出版社依 ISBN 前綴推定'); }
  b.st = found ? 'ok' : (res.some(x => x.e) ? 'pending' : 'miss');
  b.dbg = log.join('｜');
  save(); render();
  if (lastId === b.id) lastMsg(b);
}

function lastMsg(b) {
  const el = document.getElementById('last');
  const n = books.filter(x => eeOf(x) === eeOf(b) && orOf(x) === orOf(b) && !x.cand && x.ts <= b.ts).length;
  const has = b.title || b.author || b.publisher;
  el.className = b.title ? '' : (b.st === 'miss' ? 'r' : 'w');
  el.innerHTML = '✓ 已存入清單：' + esc(eeOf(b)) + ' × ' + esc(orOf(b)) + '（第 ' + n + ' 本）<br>' +
    (has ? '書名：' + esc(b.title || '（缺書名）') + (b.author ? '<br>著者：' + esc(b.author) : '') + '<br>出版社：' + esc(b.publisher || '（空白）') + (b.guess ? '（依 ISBN 推定，請確認）' : '')
      : esc(b.isbn || '') + (b.st === 'miss' ? '　查無資料，請手動補' : '　書名查詢中…'));
  el.style.display = 'block';
}

function check10(s) {
  if (!/^\d{9}[\dX]$/.test(s)) return false;
  let sum = 0;
  for (let i = 0; i < 10; i++) sum += (s[i] === 'X' ? 10 : +s[i]) * (10 - i);
  return sum % 11 === 0;
}
function urlToIsbn(raw) {
  const m = String(raw).match(/https?:\/\/[^\s)\]>"']+/i);
  if (!m) return { v: raw };
  const u = m[0];
  if (/^https?:\/\/(amzn\.(asia|to|eu)|a\.co)\//i.test(u)) return { err: '這是 Amazon 短網址，看不出書號。請在瀏覽器打開，貼上網址列的完整網址' };
  const dp = u.match(/\/(?:dp|gp\/product|product|ASIN)\/([0-9A-Z]{10})(?=[\/?#&]|$)/i);
  if (dp) {
    const a = dp[1].toUpperCase();
    if (/^B0/.test(a)) return { err: '這是 B0 開頭的商品代碼（Kindle 電子書或非書籍），不是 ISBN。電子書請用「手寫新增」' };
    if (check10(a)) return { v: a };
    return { err: '網址裡的書號 ' + a + ' 不是有效的 ISBN，可能不是書籍' };
  }
  const q = u.match(/[?&]isbn=([0-9Xx-]{10,17})/i);
  if (q) return { v: q[1] };
  const g = (u.match(/97[89]\d{10}/g) || []).find(check13);
  if (g) return { v: g };
  return { err: '這個網址裡找不到 ISBN' };
}
function clearIsbn() { const i = document.getElementById('isbnIn'); i.value = ''; clrErr(); i.focus(); }
function clrErr() { const e = document.getElementById('isbnErr'); e.textContent = ''; e.className = ''; }
function fail(m) { toast(m); const e = document.getElementById('isbnErr'); e.textContent = '⚠ ' + m; e.className = 'on'; return false; }
function addIsbn(raw) {
  clrErr();
  if (ctx.or === U) return fail('請先選擇授權者（被授權者可以先不選）');
  const ur = urlToIsbn(raw);
  if (ur.err) return fail(ur.err);
  const isbn = normIsbn(ur.v);
  if (!check13(isbn)) return fail(/^\d+$/.test(isbn) && isbn.length !== 13 ? 'ISBN 需要 13 碼，你輸入了 ' + isbn.length + ' 碼' : 'ISBN 檢查碼不符，請再核對一次');
  if (books.some(b => b.isbn === isbn && inCtx(b))) return fail('這本已經在「' + ctx.ee + ' × ' + ctx.or + '」的清單中');
  const hasData = x => x.title || x.author || x.publisher;
  const src = books.find(x => x.isbn === isbn && orOf(x) === ctx.or && hasData(x)) || books.find(x => x.isbn === isbn && hasData(x));

function csvGroup(i) {
  const g = ovKeys[i];
  if (g.mode === 'rc') csvMerged(books.filter(b => !b.cand && eeOf(b) !== U && recOf(b) === g.key), '評估申請_給' + g.key, false);
  else csvOut(byTime(books.filter(b => !b.cand && eeOf(b) === g.key)).sort((a, b) => orOf(a).localeCompare(orOf(b))), '申請一覽_' + g.key);
}

function ovlHead(title, closeFn) { return '<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:1.1rem">' + title + '</b><button class="red" style="flex:0 0 auto" onclick="' + closeFn + '()">關閉</button></div>'; }
function openFm() {
  if (ctx.or === U) return toast('請先選擇授權者（被授權者可以先不選）');
  const f = (id, lab, ph) => '<label>' + lab + '</label><input id="fm_' + id + '" placeholder="' + (ph || '') + '">';
  document.getElementById('fm').innerHTML = ovlHead('✏️ 手寫新增一本', 'closeFm') + '<div class="stat">' + esc(ctx.ee) + ' × ' + esc(ctx.or) + '　只有書名必填，其他可留白</div><div class="fm">' +
    f('title', '書名（必填）') + f('author', '著者') + f('illus', '繪者') + f('publisher', '出版社') + f('date', '出版日（未出版可填預定日期）', '例如 2026年12月') + f('isbn', '書號（選填：ISBN 或電子書 ASIN）') +
    f('note', '備註（可寫：未出版、已出版、電子書…）') +
    '<div class="err" id="fm_err"></div><button style="width:100%;margin-top:12px" onclick="saveFm()">加入清單</button></div>';
  document.getElementById('fm').style.display = 'block';
}
function closeFm() { document.getElementById('fm').style.display = 'none'; }
function saveFm() {
  const v = id => document.getElementById('fm_' + id).value.trim();
  if (!v('title')) { document.getElementById('fm_err').textContent = '請先填書名'; return; }
  const b = { id: Date.now() + Math.random(), isbn: v('isbn').replace(/\s/g, ''), title: v('title'), author: v('author'), illus: v('illus'), publisher: v('publisher'), date: v('date'), note: v('note'), type: '', manual: true, st: 'ok', ts: Date.now(), lee: ctx.ee, lor: ctx.or, got: false };
  lastId = b.id; books.unshift(b); save(); closeFm(); render(); lastMsg(b); toast('已加入 ' + b.title);
}
function openPk() {
  if (ctx.ee === U || ctx.or === U) return toast('請先選擇被授權者與授權者');
  const key = b => b.isbn || ('t:' + b.title);
  const have = new Set(books.filter(inCtx).map(key)), seen = new Set(), L = [];
  const ord = byTime(books);
  [...ord.filter(b => !b.cand), ...ord.filter(b => b.cand)].forEach(b => { const k = key(b); if (orOf(b) === ctx.or && !inCtx(b) && !have.has(k) && !seen.has(k)) { seen.add(k); L.push(b); } });
  const nc = books.filter(b => b.cand && orOf(b) === ctx.or).length;
  const who = b => [...new Set(books.filter(x => key(x) === key(b) && orOf(x) === ctx.or && !x.cand).map(x => eeOf(x) === U ? '尚未分配' : eeOf(x)))];
  document.getElementById('pk').innerHTML = ovlHead('📥 從「' + esc(ctx.or) + '」已有的書挑選', 'closePk') +
    '<div class="stat">勾選後按「加入選取的書」，會加進「' + esc(ctx.ee) + '」。搜尋時，先勾的書不會被取消。</div>' +
    '<input id="pk_q" placeholder="🔍 搜尋書名、著者、出版社、ISBN" oninput="filterPk()" style="margin-bottom:6px">' +
    (L.length ? '<div style="display:flex;gap:8px;margin:6px 0"><button class="g" style="flex:1" onclick="selVisible()">☑ 選取目前顯示的</button><button style="flex:1" onclick="addPk()">加入選取的書</button></div>' : '') +
    (L.length ? L.map(b => { const w = who(b); return '<label class="pk" data-t="' + esc([b.title, b.author, b.illus, b.publisher, b.isbn].join(' ').toLowerCase()) + '"><input type="checkbox" value="' + b.id + '"><span><b>' + esc(b.title || '（缺書名）') + '</b><br><span class="s">' + esc([b.author, b.publisher].filter(Boolean).join('／')) + '　' + esc(b.isbn || '') + '<br>' + (w.length ? '已選：' + esc(w.join('、')) : '授權者書單，尚無人選') + '</span></span></label>'; }).join('')
      : '<div class="stat">這家授權者目前沒有可挑的書</div>') +
    (nc ? '<button class="red" style="width:100%;margin-top:14px" onclick="clearCand()">清除這家授權者的匯入書單（' + nc + ' 本）</button>' : '');
  document.getElementById('pk').style.display = 'block';
}
function filterPk() {
  const q = document.getElementById('pk_q').value.trim().toLowerCase();
  document.querySelectorAll('#pk .pk').forEach(el => { el.style.display = (!q || (el.dataset.t || '').includes(q)) ? '' : 'none'; });
}
function selVisible() { document.querySelectorAll('#pk .pk').forEach(el => { if (el.style.display !== 'none') el.querySelector('input').checked = true; }); }
function clearCand() {
  const n = books.filter(b => b.cand && orOf(b) === ctx.or).length;
  if (!confirm('清除「' + ctx.or + '」匯入的書單 ' + n + ' 本？\n已經加進被授權者清單的書不受影響。')) return;
  books = books.filter(b => !(b.cand && orOf(b) === ctx.or)); save(); openPk(); render();
}
function closePk() { document.getElementById('pk').style.display = 'none'; }
function addPk() {
  const ids = [...document.querySelectorAll('#pk input:checked')].map(i => i.value);
  let n = 0;
  ids.forEach(id => {
    const s = books.find(x => String(x.id) === id); if (!s) return;
    const b = Object.assign({}, s, { id: Date.now() + Math.random(), lee: ctx.ee, lor: ctx.or, got: false, cand: false, note: '', ts: Date.now() + n, dbg: s.cand ? '由授權者書單帶入' : '由「' + eeOf(s) + '」的清單帶入' });
    books.unshift(b); n++;
    if (!b.title && b.isbn) { b.st = 'pending'; lookup(b); }
  });
  save(); closePk(); render(); toast('已帶入 ' + n + ' 本');
}
window.addEventListener('online', () => { if (books.some(b => b.st === 'pending')) relookup(); });
books.forEach(fixCreators); save();
render();
</script>
</body>
