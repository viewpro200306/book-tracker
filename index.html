<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>索書快速記錄</title>
<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3/dist/iife/polyfill.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans TC",sans-serif}
body{background:#f4f6f9;margin:0;padding:10px;color:#222}
.wrap{max-width:760px;margin:0 auto;background:#fff;border-radius:12px;padding:14px}
h1{font-size:1.15rem;text-align:center;margin:0 0 12px}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
button{flex:1;padding:11px 10px;border:0;border-radius:8px;font-weight:600;font-size:.9rem;color:#fff;background:#3b82f6}
button.g{background:#6b7280}button.ok{background:#10b981}button.red{background:#ef4444}
input{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:6px;font-size:1rem}
#reader{width:100%;display:none;margin-bottom:10px;border-radius:8px;overflow:hidden}
.add{display:flex;gap:8px;margin-bottom:10px}.add button{flex:0 0 80px}
.stat{font-size:.85rem;color:#555;margin:6px 0}
.card{border:1px solid #e5e7eb;border-radius:8px;padding:9px;margin-bottom:8px}
.card.miss{border-color:#ef4444;background:#fef2f2}.card.pending{border-color:#f59e0b;background:#fffbeb}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:#666;margin-bottom:6px}
.badge{font-weight:700}.b-ok{color:#059669}.b-miss{color:#dc2626}.b-pending{color:#d97706}
.card input{margin-bottom:5px}
.del{flex:0 0 auto;padding:3px 9px;font-size:.75rem;background:#ef4444}
.shelf{display:flex;gap:8px;margin-bottom:10px}.shelf select{flex:1;padding:10px;font-size:1rem;border:1px solid #d1d5db;border-radius:6px}.shelf button{flex:0 0 70px}.shelf label{flex:0 0 66px;align-self:center;font-size:.85rem;font-weight:600}
body{padding-bottom:110px}.lb{font-size:.75rem;color:#6b7280;margin:3px 0 2px}input.warn{background:#fff7ed;border-color:#f59e0b}.card.new{border-color:#10b981;box-shadow:0 0 0 2px #a7f3d0}
#last{position:fixed;left:0;right:0;bottom:0;background:#065f46;color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));font-size:.9rem;line-height:1.4;z-index:8;display:none}#last.w{background:#b45309}#last.r{background:#b91c1c}
#ov{position:fixed;inset:0;background:#fff;overflow:auto;z-index:20;padding:12px 12px 40px;display:none}
#ov h3{margin:14px 0 4px;font-size:1.05rem;background:#eef2ff;padding:6px 8px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#ov h4{margin:8px 0 2px;font-size:.92rem;color:#374151}#ov table{width:100%;border-collapse:collapse;font-size:.85rem}
#ov td{padding:5px 4px;border-bottom:1px solid #e5e7eb;vertical-align:top}#ov .m{color:#b45309;font-size:.75rem}
#ov .cp{flex:0 0 auto;padding:4px 10px;font-size:.78rem}.tabs{display:flex;gap:8px;margin:8px 0}.tabs button{padding:8px}
.s{color:#6b7280;font-size:.8rem}.b-part{color:#d97706}.card.part{border-color:#f59e0b;background:#fffbeb}
.ovl{position:fixed;inset:0;background:#fff;overflow:auto;z-index:25;padding:12px 12px 40px;display:none}
.fm label{display:block;font-size:.8rem;color:#6b7280;margin:8px 0 2px}.fm input,.fm select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:6px;font-size:1rem}
.pk{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #e5e7eb;font-size:.9rem}.pk input{width:auto;margin-top:4px}
.err{color:#dc2626;font-size:.8rem;margin-top:4px}
#ov .r{padding:7px 0;border-bottom:1px solid #e5e7eb;font-size:.85rem;line-height:1.5}#ov .tg{font-size:.72rem;background:#eef2ff;color:#3730a3;padding:1px 6px;border-radius:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:20px;font-size:.9rem;display:none;z-index:30}
@media print{.np{display:none!important}body{background:#fff;padding:0}.wrap{padding:0}.card input{border:0;padding:2px}}
</style>
</head>
<body>
<div class="wrap">
<h1>📖 索書快速記錄</h1>
<div class="np">
  <div class="shelf"><label>被授權者</label><select id="eeSel" onchange="setCtx('ee',this.value)"></select><button class="g" onclick="newCtx('ee')">＋新增</button></div>
  <div class="shelf"><label>授權者</label><select id="orSel" onchange="setCtx('or',this.value)"></select><button class="g" onclick="newCtx('or')">＋新增</button></div>
  <div class="shelf"><label>版代</label><select id="agSel" onchange="setAgent(this.value)"></select><button class="g" onclick="newAgent()">＋新增</button></div>
  <button id="camBtn" class="ok" style="width:100%;margin-bottom:10px" onclick="toggleCam()">📷 開始連續掃描</button>
  <div id="reader"></div>
  <video id="vid" playsinline muted autoplay style="display:none;width:100%;border-radius:8px;margin-bottom:10px;background:#000"></video>
  <div id="scanInfo" class="stat"></div>
  <div class="add">
    <input id="isbnIn" type="text" inputmode="numeric" placeholder="手動輸入 ISBN（數字鍵盤）">
    <button onclick="manualAdd()">加入</button>
  </div>
  <div class="row">
    <button class="g" onclick="openFm()">✏️ 手寫新增</button>
    <button class="g" onclick="openPk()">📥 從授權者已有的書挑選</button>
  </div>
  <div class="row">
    <button class="g" onclick="relookup()">🔄 補查未完成</button>
    <button onclick="openOv()">📋 總覽（發信前確認）</button>
  </div>
  <details style="margin-bottom:10px"><summary style="padding:8px 2px;font-weight:600;color:#555">更多功能（匯出 CSV、複製文字、備份）</summary>
  <div class="row" style="margin-top:8px">
    <button class="g" onclick="exportOr()">📤 給授權者 CSV</button>
    <button class="g" onclick="exportEe()">📤 給被授權者 CSV</button>
    <button class="g" onclick="copyOr()">📋 複製給授權者的文字</button>
    <button class="g" onclick="exportAll()">全部 CSV</button>
    <button class="g" onclick="window.print()">列印/PDF</button>
  </div>
  <div class="row">
    <button class="g" onclick="exportJSON()">備份 JSON</button>
    <button class="g" onclick="document.getElementById('imp').click()">匯入（合併）</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>
  </details>
</div>
<div class="stat" id="stat"></div>
<div id="list"></div>
</div>
<div id="ov"></div>
<div id="fm" class="ovl"></div>
<div id="pk" class="ovl"></div>
<div id="toast"></div>
<div id="last"></div>

<script>
const KEY = 'copyright_books_v2';
const DC = 'http://purl.org/dc/elements/1.1/';
let books = load(), scanner = null, scanning = false, last = { c: '', t: 0 };

function load() {
  try {
    const v2 = localStorage.getItem(KEY);
    if (v2) return JSON.parse(v2);
    const old = JSON.parse(localStorage.getItem('copyright_books') || '[]');
    return old.map(o => ({
      id: o.id, isbn: (o.isbn || '').replace(/\D/g, ''), title: o.title || '',
      publisher: o.publisher === '未提供' ? '' : (o.publisher || ''),
      author: o.author === '未提供' ? '' : (o.author || ''),
      note: o.note || '', st: o.title ? 'ok' : 'miss', ts: o.id
    }));
  } catch (e) { return []; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(books)); } catch (e) {} }
const U = '未指定';
let lastId = null;
let ctx = (() => { try { return JSON.parse(localStorage.getItem('ctx_v1')) || {}; } catch (e) { return {}; } })();
let lists = (() => { try { return JSON.parse(localStorage.getItem('lists_v1')) || { ee: [], or: [] }; } catch (e) { return { ee: [], or: [] }; } })();
ctx.ee = ctx.ee || U; ctx.or = ctx.or || U;
lists.ag = lists.ag || [];
let agents = (() => { try { return JSON.parse(localStorage.getItem('agents_v1')) || {}; } catch (e) { return {}; } })();
const pkey = (e, o) => e + '||' + o;
const agentOf = (e, o) => agents[pkey(e, o)] || '';
const eeOf = b => b.lee || b.shelf || U, orOf = b => b.lor || U;
const inCtx = b => eeOf(b) === ctx.ee && orOf(b) === ctx.or;
function opts(k) { return [...new Set([U, ...(lists[k] || []), ...books.map(k === 'ee' ? eeOf : orOf)])]; }
function saveCtx() { try { localStorage.setItem('ctx_v1', JSON.stringify(ctx)); localStorage.setItem('lists_v1', JSON.stringify(lists)); localStorage.setItem('agents_v1', JSON.stringify(agents)); } catch (e) {} }
function setAgent(v) {
  if (ctx.ee === U || ctx.or === U) { toast('請先選擇被授權者與授權者'); render(); return; }
  if (v) agents[pkey(ctx.ee, ctx.or)] = v; else delete agents[pkey(ctx.ee, ctx.or)];
  saveCtx(); render();
}
function newAgent() {
  if (ctx.ee === U || ctx.or === U) return toast('請先選擇被授權者與授權者');
  const n = (prompt('新增日方版代（公司名）') || '').trim();
  if (!n) return;
  if (!lists.ag.includes(n)) lists.ag.push(n);
  setAgent(n);
}
function setCtx(k, v) { ctx[k] = v; saveCtx(); render(); }
function newCtx(k) {
  const n = (prompt(k === 'ee' ? '新增被授權者（公司名）' : '新增授權者（公司名）') || '').trim();
  if (!n) return;
  if (!lists[k].includes(n)) lists[k].push(n);
  ctx[k] = n; saveCtx(); render();
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(m) {
  const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3000);
}

/* ISBN 驗證：只接受 978/979 開頭的 13 碼（日本書的第二組 192 價格條碼會被忽略） */
function check13(s) {
  if (!/^97[89]\d{10}$/.test(s)) return false;
  let sum = 0;
  for (let i = 0; i < 12; i++) sum += (+s[i]) * (i % 2 ? 3 : 1);
  return (10 - sum % 10) % 10 === +s[12];
}
function normIsbn(raw) {
  const s = String(raw).replace(/[^0-9Xx]/g, '').toUpperCase();
  if (s.length === 10) {
    const b = '978' + s.slice(0, 9); let sum = 0;
    for (let i = 0; i < 12; i++) sum += (+b[i]) * (i % 2 ? 3 : 1);
    return b + ((10 - sum % 10) % 10);
  }
  return s;
}

/* 書目來源：日文書優先 NDL，其次 Google Books、Open Library */
const SOURCES = [
  { name: 'NDL', async get(isbn, sig) {
    const r = await fetch('https://ndlsearch.ndl.go.jp/api/opensearch?isbn=' + isbn, { signal: sig });
    if (!r.ok) throw new Error('http');
    const x = new DOMParser().parseFromString(await r.text(), 'text/xml');
    const it = x.getElementsByTagName('item')[0];
    if (!it) return null;
    const g = (ns, n) => { const e = it.getElementsByTagNameNS(ns, n)[0]; return e ? e.textContent.trim() : ''; };
    const title = g(DC, 'title') || (it.getElementsByTagName('title')[0] || {}).textContent || '';
    const au = it.getElementsByTagName('author')[0];
    return { title: title.trim(), publisher: g(DC, 'publisher'), author: au ? au.textContent.trim() : g(DC, 'creator'), date: g(DC, 'date') };
  } },
  { name: 'Google', async get(isbn, sig) {
    const r = await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:' + isbn, { signal: sig });
    if (!r.ok) throw new Error('http');
    const d = await r.json();
    if (!d.items || !d.items.length) return null;
    const v = d.items[0].volumeInfo;
    return { title: v.title || '', publisher: v.publisher || '', author: (v.authors || []).join('、'), date: v.publishedDate || '' };
  } },
  { name: 'OpenLibrary', async get(isbn, sig) {
    const r = await fetch('https://openlibrary.org/api/books?bibkeys=ISBN:' + isbn + '&format=json&jscmd=data', { signal: sig });
    if (!r.ok) throw new Error('http');
    const d = (await r.json())['ISBN:' + isbn];
    if (!d) return null;
    return { title: d.title || '', publisher: ((d.publishers || [])[0] || {}).name || '', author: (d.authors || []).map(a => a.name).join('、'), date: d.publish_date || '' };
  } }
];

const JP = { '591': 'ポプラ社', '569': 'PHP研究所', '334': '光文社', '575': '双葉社', '480': '筑摩書房', '478': 'ダイヤモンド社', '04': 'KADOKAWA', '06': '講談社', '08': '集英社', '09': '小学館', '10': '新潮社', '12': '中央公論新社', '16': '文藝春秋' };
function jpGuess(isbn) {
  if (!isbn.startsWith('9784')) return '';
  const r = isbn.slice(4);
  return JP[r.slice(0, 3)] || JP[r.slice(0, 2)] || '';
}
const isRoman = s => !!s && !/[\u3040-\u30FF\u3400-\u9FFF]/.test(s);

async function lookup(b) {
  const res = await Promise.all(SOURCES.map(async s => {
    const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 5000);
    try { return { n: s.name, r: await s.get(b.isbn, ac.signal) }; }
    catch (e) { return { n: s.name, e: 1 }; }
    finally { clearTimeout(tm); }
  }));
  const log = [];
  res.forEach(x => {
    const has = x.r && (x.r.title || x.r.author || x.r.publisher);
    log.push(x.n + (x.e ? '連線失敗' : has ? '✓' : '無資料'));
    if (has) { ['title', 'publisher', 'author', 'date'].forEach(f => { if (!b[f] && x.r[f]) b[f] = x.r[f]; }); if (!b.src) b.src = x.n; }
  });
  if (b.author && !b.illus && /[絵画]|イラスト/.test(b.author)) {
    const ps = b.author.split(/[;；\/／]/).map(x => x.trim()).filter(Boolean);
    const il = ps.filter(x => /[絵画]|イラスト/.test(x)), au = ps.filter(x => !/[絵画]|イラスト/.test(x));
    if (il.length && au.length) { b.illus = il.map(x => x.replace(/\s*(挿絵|イラスト|絵|画)$/, '')).join('、'); b.author = au.map(x => x.replace(/\s*(原作|著|文|作)$/, '')).join('、'); }
  }
  const found = !!(b.title || b.author || b.publisher);
  const g = jpGuess(b.isbn);
  if (g && (!b.publisher || isRoman(b.publisher))) { b.publisher = g; b.guess = true; log.push('出版社依 ISBN 前綴推定'); }
  b.st = found ? 'ok' : (res.some(x => x.e) ? 'pending' : 'miss');
  b.dbg = log.join('｜');
  save(); render();
  if (lastId === b.id) lastMsg(b);
}

function lastMsg(b) {
  const el = document.getElementById('last');
  const n = books.filter(x => eeOf(x) === eeOf(b) && orOf(x) === orOf(b) && x.ts <= b.ts).length;
  const has = b.title || b.author || b.publisher;
  el.className = b.title ? '' : (b.st === 'miss' ? 'r' : 'w');
  el.innerHTML = '✓ 已存入清單：' + esc(eeOf(b)) + ' × ' + esc(orOf(b)) + '（第 ' + n + ' 本）<br>' +
    (has ? '書名：' + esc(b.title || '（缺書名）') + (b.author ? '<br>著者：' + esc(b.author) : '') + '<br>出版社：' + esc(b.publisher || '（空白）') + (b.guess ? '（依 ISBN 推定，請確認）' : '')
      : esc(b.isbn || '') + (b.st === 'miss' ? '　查無資料，請手動補' : '　書名查詢中…'));
  el.style.display = 'block';
}

function addIsbn(raw) {
  if (ctx.ee === U || ctx.or === U) { toast('請先選擇被授權者與授權者'); return false; }
  const isbn = normIsbn(raw);
  if (!check13(isbn)) { toast(/^\d+$/.test(isbn) && isbn.length !== 13 ? 'ISBN 需要 13 碼，你輸入了 ' + isbn.length + ' 碼' : 'ISBN 檢查碼不符，請再核對一次'); return false; }
  if (books.some(b => b.isbn === isbn && inCtx(b))) { toast('已在清單中'); return false; }
  const hasData = x => x.title || x.author || x.publisher;
  const src = books.find(x => x.isbn === isbn && orOf(x) === ctx.or && hasData(x)) || books.find(x => x.isbn === isbn && hasData(x));
  const b = { id: Date.now() + Math.random(), isbn, title: '', publisher: '', author: '', illus: '', date: '', note: '', st: 'pending', ts: Date.now(), lee: ctx.ee, lor: ctx.or, got: false };
  if (src) {
    ['title', 'publisher', 'author', 'illus', 'date', 'type'].forEach(f => { b[f] = src[f] || ''; });
    b.guess = !!src.guess; b.st = 'ok'; b.dbg = '由「' + eeOf(src) + ' × ' + orOf(src) + '」的清單帶入';
  }
  lastId = b.id; books.unshift(b); save(); render(); lastMsg(b);
  if (navigator.vibrate) navigator.vibrate(80);
  if (src) toast('已從「' + eeOf(src) + '」的清單帶入'); else { toast('已加入 ' + isbn); lookup(b); }
  return true;
}
function manualAdd() {
  const i = document.getElementById('isbnIn');
  if (addIsbn(i.value)) i.value = '';
}
document.getElementById('isbnIn').addEventListener('keydown', e => { if (e.key === 'Enter') manualAdd(); });

/* 連續掃描：相機保持開啟，掃到有效 ISBN 就存，不跳視窗 */
async function toggleCam() {
  const rd = document.getElementById('reader'), btn = document.getElementById('camBtn');
  if (scanning) {
    stopNative();
    try { if (scanner) { await scanner.stop(); scanner.clear(); } } catch (e) {}
    scanner = null;
    rd.style.display = 'none'; btn.textContent = '📷 開始連續掃描'; btn.className = 'ok'; scanning = false; return;
  }
  if (ctx.ee === U || ctx.or === U) { alert('請先選擇「被授權者」與「授權者」，再開始掃描'); return; }
  if (window.BarcodeDetector) {
    document.getElementById('scanInfo').textContent = '載入辨識引擎中…（第一次需要幾秒鐘）';
    try {
      await startNative();
      scanning = true; btn.textContent = '⏹ 停止掃描'; btn.className = 'red';
      document.getElementById('scanInfo').textContent = '相機運作中，尚未讀到條碼（距離約 15–25 公分，對準 978 開頭那組）';
      return;
    } catch (e) { stopNative(); }
  }
  rd.style.display = 'block';
  scanner = new Html5Qrcode('reader', { formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13], useBarCodeDetectorIfSupported: true });
  try {
    const base = { fps: 15, qrbox: (w, h) => ({ width: Math.floor(w * 0.92), height: Math.floor(Math.min(w, h) * 0.45) }) };
    try {
      await scanner.start({ facingMode: 'environment' }, Object.assign({ videoConstraints: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } }, base), onScan);
    } catch (e1) {
      await scanner.start({ facingMode: 'environment' }, base, onScan);
    }
    scanning = true; btn.textContent = '⏹ 停止掃描'; btn.className = 'red';
    document.getElementById('scanInfo').textContent = '相機運作中，尚未讀到條碼（距離約 15–25 公分，對準 978 開頭那組）';
  } catch (e) {
    rd.style.display = 'none';
    alert('無法開啟相機。請確認網頁是以 https 開啟並已允許相機權限。\n' + e);
  }
}
let stream = null, nativeOn = false, det = null;
async function startNative() {
  det = det || new BarcodeDetector({ formats: ['ean_13'] });
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  const v = document.getElementById('vid');
  v.srcObject = stream; v.style.display = 'block';
  await v.play();
  nativeOn = true;
  (async function loop() {
    while (nativeOn) {
      try {
        if (v.readyState >= 2) { const r = await det.detect(v); if (r.length) onScan(r[0].rawValue); }
      } catch (e) {}
      await new Promise(res => setTimeout(res, 60));
    }
  })();
}
function stopNative() {
  nativeOn = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const v = document.getElementById('vid'); v.srcObject = null; v.style.display = 'none';
}
function onScan(text) {
  const c = text.replace(/\D/g, ''), now = Date.now();
  document.getElementById('scanInfo').textContent = '讀到：' + c + (check13(c) ? ' ✓ 是 ISBN' : ' ✗ 不是 ISBN');
  if (!check13(c)) {
    if (/^\d{13}$/.test(c) && now - (onScan.w || 0) > 2500) { onScan.w = now; toast('這是 ' + c.slice(0, 3) + ' 開頭的商品條碼，不是 ISBN，請掃 978 開頭那組'); }
    return;
  }
  if (c === last.c && now - last.t < 3000) return;
  last = { c, t: now };
  addIsbn(c);
}

function relookup() {
  const todo = books.filter(b => !b.manual && /^97/.test(b.isbn) && (b.st !== 'ok' || !b.title));
  if (!todo.length) return toast('沒有需要補查的書');
  toast('補查 ' + todo.length + ' 本…');
  todo.forEach(b => { b.st = 'pending'; lookup(b); });
}

function upd(id, f, v) {
  const b = books.find(x => x.id === id); if (!b) return;
  b[f] = v;
  if (v && (f === 'title' || f === 'author' || f === 'publisher')) b.st = 'ok';
  if (f === 'publisher') b.guess = false;
  save(); renderStat();
  setTimeout(() => { const a = document.activeElement; if (!a || !/INPUT|SELECT|TEXTAREA/.test(a.tagName)) render(); }, 300);
}
function del(id) { if (confirm('刪除這筆？')) { books = books.filter(b => b.id !== id); save(); render(); } }

function renderStat() {
  const L = books.filter(inCtx), miss = L.filter(b => !b.title).length, nog = L.filter(b => !b.got).length;
  document.getElementById('stat').textContent = ctx.ee + ' × ' + ctx.or + '：共 ' + L.length + ' 本，缺書名 ' + miss + '，未收檔 ' + nog;
}
function render() {
  renderStat();
  const L = { ok: '✓ 已取得', miss: '✗ 查無資料，請手動補', pending: '… 查詢中/待補查' };
  ['ee', 'or'].forEach(k => { document.getElementById(k + 'Sel').innerHTML = opts(k).map(x => '<option' + (x === ctx[k] ? ' selected' : '') + '>' + esc(x) + '</option>').join(''); });
  const ags = [...new Set([...lists.ag, ...Object.values(agents)])], curAg = agentOf(ctx.ee, ctx.or);
  document.getElementById('agSel').innerHTML = '<option value="">無版代（發給授權者）</option>' + ags.map(x => '<option' + (x === curAg ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
  const mine = books.filter(inCtx), order = mine.slice().sort((a, b) => a.ts - b.ts);
  const inp = (b, f, lab, warn) => '<div class="lb">' + lab + (warn ? ' <span style="color:#b45309">' + warn + '</span>' : '') + '</div><input class="' + (warn ? 'warn' : '') + '" value="' + esc(b[f]) + '" onchange="upd(' + b.id + ',\'' + f + '\',this.value.trim())">';
  document.getElementById('list').innerHTML = mine.map(b => {
    const cls = b.title ? 'ok' : (b.st === 'ok' ? 'part' : (b.st === 'miss' ? 'miss' : 'pending'));
    const lab = { ok: '✓ 已取得', part: '△ 缺書名，請補', miss: '✗ 查無資料，請手動補', pending: '… 查詢中/待補查' }[cls];
    const n = order.findIndex(x => x.id === b.id) + 1;
    const pw = b.guess ? '⚠ 依 ISBN 推定，請確認' : (b.publisher && b.isbn && b.isbn.startsWith('9784') && isRoman(b.publisher) ? '⚠ 羅馬拼音，請改成日文' : '');
    const idt = b.manual ? '✏️ 手寫' + (b.type ? '・' + esc(b.type) : '') + (b.isbn ? '　' + esc(b.isbn) : '') : esc(b.isbn);
    return '<div class="card ' + (cls === 'ok' ? '' : cls) + (b.id === lastId ? ' new' : '') + '"><div class="top"><span><b>第 ' + n + ' 本</b>　' + idt +
      (b.manual ? '' : ' <span class="badge b-' + cls + '">' + lab + '</span>') + '</span><label class="np" style="font-size:.8rem;margin-left:auto;margin-right:8px"><input type="checkbox" style="width:auto" ' + (b.got ? 'checked ' : '') + 'onchange="upd(' + b.id + ',\'got\',this.checked)"> 已收檔</label><button class="del np" onclick="del(' + b.id + ')">刪除</button></div>' +
      inp(b, 'title', '書名') + inp(b, 'author', '著者') + inp(b, 'illus', '繪者') + inp(b, 'publisher', '出版社', pw) + inp(b, 'date', '出版日') + inp(b, 'note', '備註') +
      (b.dbg ? '<div class="lb" style="margin-top:4px">查詢紀錄：' + esc(b.dbg) + '</div>' : '') + '</div>';
  }).join('') || '<div class="stat">尚無紀錄，開始掃描吧</div>';
}

async function dl(name, mime, text) {
  try {
    const f = new File([text], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function csvOut(L, name, withGot) {
  if (!L.length) return toast('沒有資料');
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const head = ['被授權者', '授權者', '版代', '序號', '書名', '著者', '繪者', '出版社', '出版日', '書號', '類型'].concat(withGot ? ['收檔'] : [], ['備註']);
  const rows = [head.map(q).join(',')];
  L.forEach((b, i) => rows.push([eeOf(b), orOf(b), agentOf(eeOf(b), orOf(b)), i + 1, b.title, b.author, b.illus, b.publisher, b.date, '="' + (b.isbn || '') + '"', b.type || ''].concat(withGot ? [b.got ? '已收到' : '未收到'] : [], [b.note]).map(q).join(',')));
  dl(name + '_' + new Date().toISOString().slice(0, 10) + '.csv', 'text/csv;charset=utf-8', '\ufeff' + rows.join('\r\n'));
}
const byTime = L => L.slice().sort((a, b) => a.ts - b.ts);
function exportOr() { csvOut(byTime(books.filter(b => orOf(b) === ctx.or)), '評估申請_給' + ctx.or, false); }
function exportEe() { csvOut(byTime(books.filter(b => eeOf(b) === ctx.ee)).sort((a, b) => orOf(a).localeCompare(orOf(b))), '申請一覽_' + ctx.ee, true); }
function exportAll() { csvOut(byTime(books), '索書清單_全部', true); }
function copyOr() {
  const L = byTime(books.filter(b => orOf(b) === ctx.or));
  if (!L.length) return toast('沒有資料');
  const g = {}; L.forEach(b => (g[eeOf(b)] = g[eeOf(b)] || []).push(b));
  const t = Object.keys(g).map(k => '【' + k + '】\n' + g[k].map((b, i) => (i + 1) + '. ' + (b.title || '(書名待補)') + '／' + (b.publisher || '') + '／' + b.isbn).join('\n')).join('\n\n');
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('已複製'), () => prompt('請手動複製', t));
}
function exportJSON() {
  if (!books.length) return toast('沒有資料');
  dl('索書備份_' + new Date().toISOString().slice(0, 10) + '.json', 'application/json', JSON.stringify({ v: 3, books, agents, lists }, null, 2));
}
function importJSON(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d0 = JSON.parse(r.result), arr = Array.isArray(d0) ? d0 : d0.books;
      if (!Array.isArray(arr)) throw 0;
      if (d0.agents) Object.assign(agents, d0.agents);
      if (d0.lists) ['ee', 'or', 'ag'].forEach(k => (d0.lists[k] || []).forEach(x => { if (!lists[k].includes(x)) lists[k].push(x); }));
      let n = 0;
      arr.forEach(o => {
        const e = o.lee || o.shelf || ctx.ee, c = o.lor || ctx.or, k = o.isbn || ('t:' + o.title);
        if (!books.some(b => (b.isbn || ('t:' + b.title)) === k && eeOf(b) === e && orOf(b) === c)) {
          books.push(Object.assign({}, o, { id: Date.now() + Math.random(), lee: e, lor: c, got: !!o.got, st: o.st || (o.title ? 'ok' : 'pending'), ts: o.ts || Date.now() })); n++;
        }
      });
      save(); saveCtx(); render(); toast('匯入 ' + n + ' 筆（已存在的略過）');
    } catch (e) { alert('檔案格式不正確'); }
    ev.target.value = '';
  };
  r.readAsText(f);
}

let ovMode = 'rc', ovTexts = [];
function openOv() { document.getElementById('ov').style.display = 'block'; renderOv(); }
function closeOv() { document.getElementById('ov').style.display = 'none'; }
function setOvMode(m) { ovMode = m; renderOv(); }
const pubWarn = b => b.guess || (b.publisher && b.isbn && b.isbn.startsWith('9784') && isRoman(b.publisher));
const recOf = b => { const a = agentOf(eeOf(b), orOf(b)); return a ? '日方版代 ' + a : orOf(b); };
function merge(list) {
  const m = new Map();
  list.forEach(b => {
    const k = b.isbn || ('t:' + b.title);
    if (!m.has(k)) m.set(k, { b, ees: [] });
    const e = m.get(k);
    if (!e.ees.includes(eeOf(b))) e.ees.push(eeOf(b));
    if (!e.b.title && b.title) e.b = b;
  });
  return [...m.values()];
}
const fmtLine = (b, n, who) => n + '. ' + (b.title || '(書名待補)') + '／' + (b.author || '著者未填') + (b.illus ? '／繪者：' + b.illus : '') + '／' + (b.publisher || '出版社未填') + (b.date ? '／' + b.date : '') + (b.isbn ? '／' + b.isbn : '／書號未填') + (b.manual && b.type ? '／' + b.type : '') + (who ? '（評估：' + who + '）' : '');
function rowHtml(b, n, who, showGot) {
  return '<div class="r"><b>' + n + '. ' + (b.title ? esc(b.title) : '<span class="m">⚠ 缺書名</span>') + '</b>' +
    (b.manual ? ' <span class="tg">手寫' + (b.type ? '・' + esc(b.type) : '') + '</span>' : '') +
    (who ? ' <span class="tg">評估：' + esc(who) + '</span>' : '') + (showGot && b.got ? ' <span class="tg">✓已收檔</span>' : '') +
    '<br><span class="s">著者：' + esc(b.author || '—') + (b.illus ? '　繪者：' + esc(b.illus) : '') + '</span>' +
    '<br><span class="s">' + esc(b.publisher || '出版社未填') + (pubWarn(b) ? ' <span class="m">⚠ 待確認</span>' : '') + (b.date ? '　' + esc(b.date) : '') + '　' + esc(b.isbn || '書號未填') + '</span></div>';
}
function renderOv() {
  ovTexts = [];
  const miss = books.filter(b => !b.title).length, pw = books.filter(pubWarn).length, got = books.filter(b => b.got).length;
  let h = '<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:1.1rem">📋 總覽（合併顯示）</b><button class="red" style="flex:0 0 auto" onclick="closeOv()">關閉</button></div>' +
    '<div class="tabs"><button class="' + (ovMode === 'rc' ? '' : 'g') + '" onclick="setOvMode(\'rc\')">依發信對象</button><button class="' + (ovMode === 'ee' ? '' : 'g') + '" onclick="setOvMode(\'ee\')">依被授權者</button></div>' +
    '<div class="stat">共 ' + books.length + ' 筆｜⚠ 缺書名 ' + miss + '｜⚠ 出版社待確認 ' + pw + '｜已收檔 ' + got + '</div>';
  if (!books.length) h += '<div class="stat">尚無紀錄</div>';
  const groups = {};
  if (ovMode === 'rc') {
    byTime(books).forEach(b => { const r = recOf(b), o = orOf(b); ((groups[r] = groups[r] || {})[o] = groups[r][o] || []).push(b); });
    Object.keys(groups).sort().forEach(r => {
      const viaAgent = r.startsWith('日方版代 ');
      let total = 0, body = '', txt = '【' + r + '】\n';
      Object.keys(groups[r]).sort().forEach(o => {
        const items = merge(groups[r][o]); total += items.length;
        if (viaAgent) { body += '<h4>' + esc(o) + '（' + items.length + ' 本）</h4>'; txt += '■ ' + o + '\n'; }
        items.forEach((e, i) => { const who = e.ees.join('、') + (e.ees.length > 1 ? '（' + e.ees.length + ' 家）' : ''); body += rowHtml(e.b, i + 1, who, false); txt += fmtLine(e.b, i + 1, who) + '\n'; });
        txt += '\n';
      });
      h += '<h3><span>' + esc(r) + '（共 ' + total + ' 本）</span><button class="cp" onclick="copyGroup(' + ovTexts.length + ')">複製文字</button></h3>' + body;
      ovTexts.push(txt.trim());
    });
  } else {
    byTime(books).forEach(b => { const e = eeOf(b), o = orOf(b); ((groups[e] = groups[e] || {})[o] = groups[e][o] || []).push(b); });
    Object.keys(groups).sort().forEach(e => {
      let total = 0, body = '', txt = '【' + e + '】\n';
      Object.keys(groups[e]).sort().forEach(o => {
        const L = groups[e][o], ag = agentOf(e, o), t = o + (ag ? '（經版代 ' + ag + '）' : '');
        total += L.length;
        body += '<h4>' + esc(t) + '（' + L.length + ' 本）</h4>'; txt += '■ ' + t + '\n';
        L.forEach((b, i) => { body += rowHtml(b, i + 1, '', true); txt += fmtLine(b, i + 1, '') + '\n'; });
        txt += '\n';
      });
      h += '<h3><span>' + esc(e) + '（共 ' + total + ' 本）</span><button class="cp" onclick="copyGroup(' + ovTexts.length + ')">複製文字</button></h3>' + body;
      ovTexts.push(txt.trim());
    });
  }
  document.getElementById('ov').innerHTML = h;
}
function copyText(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('已複製'), () => prompt('請手動複製', t)); }
function copyGroup(i) { copyText(ovTexts[i]); }

function ovlHead(title, closeFn) { return '<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:1.1rem">' + title + '</b><button class="red" style="flex:0 0 auto" onclick="' + closeFn + '()">關閉</button></div>'; }
function openFm() {
  if (ctx.ee === U || ctx.or === U) return toast('請先選擇被授權者與授權者');
  const f = (id, lab, ph) => '<label>' + lab + '</label><input id="fm_' + id + '" placeholder="' + (ph || '') + '">';
  document.getElementById('fm').innerHTML = ovlHead('✏️ 手寫新增一本', 'closeFm') + '<div class="stat">' + esc(ctx.ee) + ' × ' + esc(ctx.or) + '　只有書名必填，其他可留白</div><div class="fm">' +
    f('title', '書名（必填）') + f('author', '著者') + f('illus', '繪者') + f('publisher', '出版社') + f('date', '出版日（未出版可填預定日期）', '例如 2026年12月') + f('isbn', '書號（選填：ISBN 或電子書 ASIN）') +
    '<label>類型</label><select id="fm_type"><option>未出版</option><option>電子書</option><option>已出版</option></select>' + f('note', '備註') +
    '<div class="err" id="fm_err"></div><button style="width:100%;margin-top:12px" onclick="saveFm()">加入清單</button></div>';
  document.getElementById('fm').style.display = 'block';
}
function closeFm() { document.getElementById('fm').style.display = 'none'; }
function saveFm() {
  const v = id => document.getElementById('fm_' + id).value.trim();
  if (!v('title')) { document.getElementById('fm_err').textContent = '請先填書名'; return; }
  const b = { id: Date.now() + Math.random(), isbn: v('isbn').replace(/\s/g, ''), title: v('title'), author: v('author'), illus: v('illus'), publisher: v('publisher'), date: v('date'), note: v('note'), type: v('type'), manual: true, st: 'ok', ts: Date.now(), lee: ctx.ee, lor: ctx.or, got: false };
  lastId = b.id; books.unshift(b); save(); closeFm(); render(); lastMsg(b); toast('已加入 ' + b.title);
}
function openPk() {
  if (ctx.ee === U || ctx.or === U) return toast('請先選擇被授權者與授權者');
  const key = b => b.isbn || ('t:' + b.title);
  const have = new Set(books.filter(inCtx).map(key)), seen = new Set(), L = [];
  byTime(books).forEach(b => { const k = key(b); if (orOf(b) === ctx.or && !inCtx(b) && !have.has(k) && !seen.has(k)) { seen.add(k); L.push(b); } });
  document.getElementById('pk').innerHTML = ovlHead('📥 從「' + esc(ctx.or) + '」已有的書挑選', 'closePk') + '<div class="stat">勾選後加入「' + esc(ctx.ee) + '」</div>' +
    (L.length ? L.map(b => '<label class="pk"><input type="checkbox" value="' + b.id + '"><span><b>' + esc(b.title || '（缺書名）') + '</b><br><span class="s">' + esc(b.publisher || '') + '　' + esc(b.isbn || '') + '<br>已選：' + esc([...new Set(books.filter(x => key(x) === key(b) && orOf(x) === ctx.or).map(eeOf))].join('、')) + '</span></span></label>').join('') +
      '<button style="width:100%;margin-top:12px" onclick="addPk()">加入選取的書</button>' : '<div class="stat">這家授權者目前沒有其他被授權者選的書可挑</div>');
  document.getElementById('pk').style.display = 'block';
}
function closePk() { document.getElementById('pk').style.display = 'none'; }
function addPk() {
  const ids = [...document.querySelectorAll('#pk input:checked')].map(i => i.value);
  let n = 0;
  ids.forEach(id => {
    const s = books.find(x => String(x.id) === id); if (!s) return;
    books.unshift(Object.assign({}, s, { id: Date.now() + Math.random(), lee: ctx.ee, lor: ctx.or, got: false, note: '', ts: Date.now() + n, dbg: '由「' + eeOf(s) + '」的清單帶入' })); n++;
  });
  save(); closePk(); render(); toast('已帶入 ' + n + ' 本');
}
window.addEventListener('online', () => { if (books.some(b => b.st === 'pending')) relookup(); });
render();
</script>
